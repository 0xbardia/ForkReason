[project]
name = "forkreason"
version = "1.0.1"
description = "ForkReason — software lineage and provenance, verified by GenLayer consensus"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

# Contract toolchain. `genlayer-test` does NOT pin `genlayer_py`, so a fresh
# install otherwise resolves an older client that cannot fetch a contract schema
# from a current GLSim node. Both are pinned here so a fresh clone is
# reproducible rather than accidentally working.
contract = [
    # Pinned to the git tag, NOT the PyPI build.
    #
    # Both report version 0.29.2, but the PyPI wheel vendors an older glsim
    # whose engine lacks `__type_desc__` handling. With it, contract deployment
    # rolls back inside consensus with:
    #   'ForkReasonRegistry' object has no attribute '__type_desc__'
    # Studio Mode therefore only runs against the git source, which is what was
    # certified. glsim has no independent distribution, so pinning the tag is
    # the only way to make a fresh clone reproducible.
    "genlayer-test[sim] @ git+https://github.com/genlayerlabs/genlayer-testing-suite@v0.29",
    "genlayer-py==0.18.0",
    # The GenLayer SDK imports numpy for u256 / fixed-point arithmetic but does
    # not declare it, so a clean install fails at contract load time with
    # "No module named 'numpy'". Declared here so a fresh clone works.
    "numpy>=1.26",
    # Provides the `genvm-lint` binary used as a release gate. It was installed
    # in the canonical venv but declared nowhere, so a fresh clone could not run
    # one of the three contract gates the documentation lists.
    "genvm-linter>=0.11.1rc2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required because the `contract` extra pins `genlayer-test` to a git tag.
# hatchling refuses to build metadata for an optional-dependency group
# containing a direct URL reference unless this is explicitly enabled, which
# made the documented `pip install -e '.[dev]'` fail outright on a fresh clone:
#   ValueError: Dependency #1 of option `contract` ... cannot be a direct
#   reference unless field `tool.hatch.metadata.allow-direct-references` is set
# The canonical tree only ever worked because its venv had been built before
# this extra was introduced.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["apps/api/forkreason"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
python_files = ["test_*.py"]
markers = [
    "integration: tests requiring a live PostgreSQL database",
]
filterwarnings = ["ignore::DeprecationWarning"]

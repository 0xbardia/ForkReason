# ForkReason V1 — production nginx site.
#
# Front-facing TLS termination and reverse proxy. Nothing else on this host is
# touched: PostgreSQL, the API and the worker all stay on loopback and are
# never exposed publicly.
#
#   nginx -t && systemctl reload nginx

upstream forkreason_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream forkreason_api {
    server 127.0.0.1:8421;
    keepalive 16;
}

# Managed by certbot. Re-running `certbot renew` rewrites only the TLS lines.

server {
    listen 80;
    listen [::]:80;
    server_name forkreason.bydx.fun;

    # ACME HTTP-01 must stay on plain HTTP or renewal breaks.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forkreason.bydx.fun;

    ssl_certificate     /etc/letsencrypt/live/forkreason.bydx.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forkreason.bydx.fun/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- security headers -------------------------------------------------
    # The CSP itself is set by the Next middleware with a per-request nonce, so
    # it is NOT duplicated here: two policies intersect, and a nonce in one
    # policy does not satisfy the other.
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"       always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;

    # --- compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # Analysis submissions carry a bounded evidence digest, not a repository.
    client_max_body_size 1m;
    client_body_timeout 30s;

    # --- API --------------------------------------------------------------
    location = /api/v1/analyses {
        proxy_pass         http://forkreason_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Submitting an analysis does snapshot both repositories inline: it
        # resolves the pinned commit, fetches the archive, and extracts it, so
        # a large repository legitimately takes longer than 30s. Analysis
        # itself runs in the worker, so this timeout still cannot mask a stuck
        # worker — only slow intake.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    180s;
        proxy_buffering       off;
    }

    location /api/ {
        proxy_pass         http://forkreason_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Everything else is a read: fast, bounded, no snapshotting.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       off;
    }

    # Liveness and readiness are public so an external monitor can use them.
    location = /health {
        proxy_pass       http://forkreason_api;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /ready {
        proxy_pass       http://forkreason_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- static assets ----------------------------------------------------
    location /_next/static/ {
        proxy_pass       http://forkreason_web;
        proxy_set_header Host $host;
        # Content-addressed filenames: safe to cache for a year.
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- frontend ---------------------------------------------------------
    location / {
        proxy_pass         http://forkreason_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # The nonce CSP requires a fresh render per request; never cache HTML.
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
}